name: Release

on:
  push:
    tags: ["v*"]
  # A dry run — by hand, or for pull requests that change the packaging:
  # builds, signs and packages everything, named v0.0.0-dev, and keeps the
  # files as workflow artifacts instead of publishing a release. Only the
  # hand-started dry run is notarised (see NOTARIZE below).
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/release.yml
      - scripts/make-app.sh
      - scripts/make-dmg.sh
      - scripts/sign-binaries.sh
      - scripts/notarize.sh
      - scripts/fetch-static-tools.sh
      - scripts/smoke-bundled-ffmpeg.sh
      - scripts/build-xpress-ai.sh

# Building (and pull-request dry runs) only reads the repository; only the
# `publish` job, for a tag, may write the release.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    # Map secrets to env so they can be referenced in `if:` (secrets context
    # isn't allowed there directly).
    env:
      TAG: ${{ github.ref_type == 'tag' && github.ref_name || 'v0.0.0-dev' }}
      MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
      # Notarise tags and hand-started dry runs; pull requests still build
      # and sign, but skip the notary service (it can be down or refuse the
      # team for reasons that have nothing to do with the change).
      NOTARIZE: ${{ github.event_name != 'pull_request' && secrets.APPLE_APP_PASSWORD != '' && '1' || '0' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          # The command line for Windows (the app is macOS/Linux only).
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v5
      - name: Tag matches the crate version
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          crate="$(sed -n '/^\[workspace.package\]/,/^\[/s/^version *= *"\(.*\)"/\1/p' Cargo.toml | head -1)"
          if [[ "${TAG#v}" != "$crate" ]]; then
            echo "::error::tag $TAG does not match the version in Cargo.toml ($crate)"
            exit 1
          fi
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Install Linux GUI/clipboard dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev libxdo-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libgl1-mesa-dev

      - name: Build release binaries
        shell: bash
        run: |
          cargo build --release --target ${{ matrix.target }} -p xpress-cli
          if [[ "$RUNNER_OS" != "Windows" ]]; then
            cargo build --release --target ${{ matrix.target }} -p xpress-gui
          fi

      # Third-party downloads are fetched (and checked against their pinned
      # SHA-256) before any signing key is on this machine.
      - name: Fetch bundled tools
        if: runner.os == 'macOS'
        shell: bash
        run: scripts/fetch-static-tools.sh "${{ matrix.target }}" bundle-tools

      # Every encoder xpress uses, through the ffmpeg the app will bundle.
      - name: Check xpress with the bundled ffmpeg
        if: runner.os == 'macOS'
        shell: bash
        run: scripts/smoke-bundled-ffmpeg.sh "target/${{ matrix.target }}/release/xpress" bundle-tools

      - name: Import signing certificate
        if: runner.os == 'macOS' && env.MACOS_CERT_P12 != ''
        env:
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          kc="$RUNNER_TEMP/build.keychain"
          pw="ci-$(openssl rand -hex 8)"
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$pw" "$kc"
          security set-keychain-settings -lut 3600 "$kc"
          security unlock-keychain -p "$pw" "$kc"
          security import "$RUNNER_TEMP/cert.p12" -k "$kc" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          security set-key-partition-list -S apple-tool:,apple: -s -k "$pw" "$kc"
          rm -f "$RUNNER_TEMP/cert.p12"

      - name: Package
        shell: bash
        env:
          XPRESS_SIGN_ID: ${{ secrets.MACOS_SIGN_IDENTITY }}
          XPRESS_NOTARIZE: ${{ env.NOTARIZE }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          dist="xpress-${TAG}-${{ matrix.target }}"
          mkdir -p "$dist"
          bin_dir="target/${{ matrix.target }}/release"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            cp "$bin_dir/xpress.exe" README.md LICENSE NOTICE.md "$dist/"
            7z a -tzip "$dist.zip" "$dist" > /dev/null
            sha256sum "$dist.zip" > "$dist.zip.sha256"
            exit 0
          fi
          cp "$bin_dir/xpress" "$dist/"
          cp "$bin_dir/xpress-gui" "$dist/"
          # Developer ID sign + notarise the standalone binaries too, so a
          # downloaded tarball (and `xpress update`) doesn't trip Gatekeeper.
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            scripts/sign-binaries.sh "$dist/xpress" "$dist/xpress-gui"
          fi
          cp README.md LICENSE NOTICE.md "$dist/"
          tar -czf "$dist.tar.gz" "$dist"
          shasum -a 256 "$dist.tar.gz" > "$dist.tar.gz.sha256"

      - name: Build macOS .app bundle
        if: runner.os == 'macOS'
        shell: bash
        env:
          XPRESS_SIGN_ID: ${{ secrets.MACOS_SIGN_IDENTITY }}
          XPRESS_NOTARIZE: ${{ env.NOTARIZE }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          bin_dir="target/${{ matrix.target }}/release"
          # Release builds for Apple silicon must include the Apple
          # Intelligence helper; a runner without the SDK fails the build.
          if [[ "${{ matrix.target }}" == aarch64-* && "${{ github.ref_type }}" == tag ]]; then
            export XPRESS_REQUIRE_AI=1
          fi
          scripts/make-app.sh --gui "$bin_dir/xpress-gui" --bin-dir bundle-tools \
            --out dist-app --version "${TAG#v}"
          # Keep "-macos-" before the target: `xpress update` (self_update) takes
          # the first asset, alphabetically, containing the target triple, and
          # that must be the CLI tarball. "-macos-" sorts after "-aarch64…",
          # while the name still contains the target and ends in -app.zip,
          # which the desktop app's updater looks for.
          app_zip="xpress-${TAG}-macos-${{ matrix.target }}-app.zip"
          ditto -c -k --keepParent dist-app/xpress.app "$app_zip"
          shasum -a 256 "$app_zip" > "$app_zip.sha256"
          dmg="xpress-${TAG}-macos-${{ matrix.target }}.dmg"
          scripts/make-dmg.sh --app dist-app/xpress.app --out "$dmg" --version "${TAG#v}"
          shasum -a 256 "$dmg" > "$dmg.sha256"

      - name: Remove the signing keychain
        if: always() && runner.os == 'macOS'
        shell: bash
        run: |
          security delete-keychain "$RUNNER_TEMP/build.keychain" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/cert.p12"

      - name: Keep the files
        uses: actions/upload-artifact@v7
        with:
          name: xpress-${{ matrix.target }}
          path: |
            xpress-*.tar.gz*
            xpress-*.zip*
            xpress-*.dmg*

  publish:
    name: publish release
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: xpress-*
          merge-multiple: true
      - name: Check the checksums
        run: |
          set -euo pipefail
          for f in *.sha256; do sha256sum -c "$f"; done
      - name: Upload to release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            xpress-*.tar.gz
            xpress-*.tar.gz.sha256
            xpress-*-app.zip
            xpress-*-app.zip.sha256
            xpress-*-windows-msvc.zip
            xpress-*-windows-msvc.zip.sha256
            xpress-*.dmg
            xpress-*.dmg.sha256
          generate_release_notes: true
