[package]
name = "xpress-gui"
version.workspace = true
edition.workspace = true
# egui/eframe 0.36 need a newer compiler than the engine and the CLI.
rust-version = "1.95"
license.workspace = true
description = "Desktop GUI for xpress — floating results, drag-and-drop, global hotkeys"

[[bin]]
name = "xpress-gui"
path = "src/main.rs"

[dependencies]
xpress-core = { path = "../xpress-core" }
anyhow.workspace = true
eframe = "0.36"
egui = "0.36"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "tiff"] }
global-hotkey = "0.6"
arboard = "3"
rfd = "0.15"
tray-icon = "0.19"
serde.workspace = true
serde_json.workspace = true
# Self-update staging folder.
tempfile.workspace = true

[dev-dependencies]
egui_kittest = "0.36"

# Wayland compositors with the data-control protocol (X11 works without it).
[target.'cfg(target_os = "linux")'.dependencies]
arboard = { version = "3", features = ["wayland-data-control"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSResponder"] }
objc2-foundation = "0.3"
# Recognising screenshots by their Finder metadata.
xattr = "1"
# Open at login (SMAppService).
objc2-service-management = "0.3"
