[workspace]
resolver = "2"
members = [
    "crates/xpress-core",
    "crates/xpress-cli",
    "crates/xpress-gui",
]
exclude = ["tools/icon-gen"]

[workspace.package]
version = "1.1.0"
edition = "2021"
rust-version = "1.90"
license = "MIT"
authors = ["Knut W. Horne <https://kwhorne.com>"]
repository = "https://github.com/kwhorne/xpress"
description = "Image, video, PDF and audio optimiser — an independent Rust tool"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
which = "7"
walkdir = "2"
rayon = "1"
num_cpus = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
tempfile = "3"

# Release builds: the codecs (rav1e/ravif, oxipng, quantette, ssimulacra2,
# lopdf) gain from whole-program optimisation, and stripped symbols make the
# binaries much smaller.
[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
